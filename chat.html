<body>
  <canvas id="chat-cosmos-canvas" class="chat-cosmos-canvas" aria-hidden="true"></canvas>
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <div id="xray-popover" class="xray-popover" role="dialog" aria-label="Token Decision Inspector"></div>
  <div id="share-toast" class="share-toast" role="status" aria-live="polite"></div>
  <div class="chat-app">
    <aside id="sidebar" class="sidebar">
      <div class="sb-top">
        <div class="sb-brand">
          <a class="sb-brand-link" href="./index.html">
            <span class="sb-emblem" aria-hidden="true">
              <img src="./mark.svg?v=35" alt="" width="28" height="28" />
            </span>
            <span>Space AI</span>
          </a>
        </div>
        <button id="btn-new-chat" type="button" class="btn-new">+ New Chat</button>
        <input id="sb-search" type="search" class="sb-search" placeholder="Search chats..." />
      </div>

      <div id="sb-list" class="sb-list"></div>

      <div class="sb-foot">
        <div class="sb-fleet">
          <span class="dot"></span>
          <span id="sb-fleet-text">Connecting fleet...</span>
        </div>
        <div class="sb-nav-links">
          <a href="./index.html">Home</a>
          <a href="./blog.html">Research</a>
          <a href="./papers.html">Papers</a>
          <a href="./product.html">Product</a>
          <a href="./network.html">Network</a>
          <a href="https://github.com/spaceresearchai/spaceresearch.ai/releases/latest" target="_blank" rel="noopener">Desktop App</a>
          <a href="https://github.com/spaceresearchai" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <header class="topbar">
        <div class="tb-left">
          <button id="btn-toggle-sb" type="button" class="icon-btn" title="Toggle sidebar">&#9776;</button>
          <select id="model-select" class="model-select" aria-label="AI Model">
            <option value="qwen3.8-27b" selected>Qwen3.8 27B</option>
            <option value="inkling-2-mini">Inkling 2 Mini</option>
            <option value="space-council">Swarm Council</option>
            <option value="space-70b-shard">70B Sharded</option>
          </select>
          <select id="node-select" class="model-select" aria-label="Serving Node">
            <option value="auto" selected>Auto Station</option>
          </select>
        </div>
        <div class="tb-right">
          <button id="btn-xray" type="button" class="icon-btn xray-btn active" title="Toggle live confidence inspection"><span class="xray-dot"></span><span>Confidence · On</span></button>
          <a class="icon-btn" href="https://github.com/spaceresearchai/spaceresearch.ai/releases/latest" target="_blank" rel="noopener" title="Download Space AI Desktop App for Mac, Windows &amp; Linux">Desktop App</a>
          <a class="icon-btn" href="./network.html">Network</a>
        </div>
      </header>

      <div id="thread-scroll" class="thread-scroll">
        <div id="thread-inner" class="thread-inner"></div>
      </div>

      <div class="composer-area">
        <div id="composer-box" class="composer-box">
          <div id="attach-strip" class="attach-strip"></div>
          <div class="composer-row">
            <input id="file-image" type="file" accept="image/*" multiple hidden />
            <button id="btn-attach" type="button" class="btn-attach" title="Attach image (or paste / drag &amp; drop)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <textarea id="composer-input" class="composer-input" rows="1" placeholder="Ask anything"></textarea>
            <button id="btn-send" type="button" class="btn-send">Send</button>
          </div>
        </div>
        <div id="ctx-meter" class="composer-foot">Space AI · Open community models</div>
      </div>
    </main>
  </div>

  <script>
  (() => {
    const c = document.getElementById("chat-cosmos-canvas");
    if (!c || !c.getContext) return;
    const ctx = c.getContext("2d");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cols = [[235, 235, 240], [190, 190, 200], [215, 215, 222], [160, 160, 172]];
    let nodes = [];
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = Math.floor(window.innerWidth * dpr);
      c.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(84, Math.floor((window.innerWidth * window.innerHeight) / 16000));
      nodes = Array.from({ length: count }, (_, idx) => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 0.7 + Math.random() * 1.15,
        phase: Math.random() * Math.PI * 2,
        spd: 0.004 + Math.random() * 0.008,
        rgb: cols[idx % cols.length],
      }));
    }
    resize();
    window.addEventListener("resize", resize);
    let raf = 0;
    function draw() {
      const w = window.innerWidth, h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < nodes.length; i++) {
        const s = nodes[i];
        if (!reduced) s.phase += s.spd;
        const px = s.x + Math.sin(s.phase) * 8;
        const py = s.y + Math.cos(s.phase * 0.8) * 7;
        for (let j = i + 1; j < nodes.length; j++) {
          const o = nodes[j];
          const dx = px - o.x, dy = py - o.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 9500) {
            ctx.strokeStyle = `rgba(${s.rgb[0]}, ${s.rgb[1]}, ${s.rgb[2]}, ${((1 - d2 / 9500) * 0.10).toFixed(3)})`;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(o.x, o.y);
            ctx.stroke();
          }
        }
        const a = 0.16 + 0.34 * (0.5 + 0.5 * Math.sin(s.phase));
        ctx.fillStyle = `rgba(${s.rgb[0]}, ${s.rgb[1]}, ${s.rgb[2]}, ${a.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(px, py, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduced) raf = requestAnimationFrame(draw);
    }
    draw();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else if (!reduced) draw();
    });
  })();
  </script>
  <script src="./chat.js?v=27"></script>
</body>
</html>
