<html lang="en">
<head>

  <meta property="og:site_name" content="Space AI" />

  <meta property="og:description" content="Watch token-level certainty, competing thoughts, bluff risk, and framing flips live on community local silicon. Free, no login." />
  <meta property="og:url" content="https://spaceresearch.ai/chat.html" />
  <meta property="og:image" content="https://spaceresearch.ai/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Space Chat · Decision X-Ray for Open Local AI" />
  <meta name="twitter:description" content="Watch token-level certainty, competing thoughts, bluff risk, and framing flips live on community local silicon. Free, no login." />
  <meta name="twitter:image" content="https://spaceresearch.ai/og-card.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://api.spaceresearch.ai" crossorigin />
  <link rel="dns-prefetch" href="https://api.spaceresearch.ai" />
  <link rel="icon" type="image/svg+xml" href="./mark.svg?v=35" />
  <link rel="stylesheet" href="./chat.css?v=14" />
</head>
<body>
  <canvas id="chat-cosmos-canvas" class="chat-cosmos-canvas" aria-hidden="true"></canvas>
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <div id="xray-popover" class="xray-popover" role="dialog" aria-label="Token Decision Inspector"></div>
  <div id="share-toast" class="share-toast" role="status" aria-live="polite"></div>
  <div class="chat-app">
    <aside id="sidebar" class="sidebar">
      <div class="sb-top">
        <div class="sb-brand">
          <a class="sb-brand-link" href="./index.html">
            <span class="sb-emblem logo-orbit" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
                <g class="orbit-ring-a"><ellipse cx="14" cy="14" rx="11" ry="4.4" stroke="currentColor" stroke-width="1.4" opacity="0.92"/></g>
                <g class="orbit-ring-b"><ellipse cx="14" cy="14" rx="10.5" ry="4.2" stroke="currentColor" stroke-width="1.1" opacity="0.48"/></g>
                <circle cx="14" cy="14" r="2.7" fill="currentColor"/>
              </svg>
            </span>
            <span>Space AI</span>
          </a>
        </div>
        <button id="btn-new-chat" type="button" class="btn-new">+ New Chat</button>
        <input id="sb-search" type="search" class="sb-search" placeholder="Search chats..." />
      </div>

      <div id="sb-list" class="sb-list"></div>

      <div class="sb-foot">
        <div class="sb-fleet">
          <span class="dot"></span>
          <span id="sb-fleet-text">Connecting fleet...</span>
        </div>
        <div class="sb-nav-links">
          <a href="./index.html">Home</a>
          <a href="./product.html">Product</a>
          <a href="./blog.html">Blog</a>
          <a href="./network.html">Network</a>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <header class="topbar">
        <div class="tb-left">
          <button id="btn-toggle-sb" type="button" class="icon-btn" title="Toggle sidebar">&#9776;</button>
          <select id="model-select" class="model-select" aria-label="AI Model">
            <option value="qwen3.8-27b" selected>Qwen3.8 27B</option>
            <option value="inkling-2-mini">Inkling 2 Mini</option>
            <option value="space-council">Swarm Council</option>
            <option value="space-70b-shard">70B Sharded</option>
          </select>
          <select id="node-select" class="model-select" aria-label="Serving Node">
            <option value="auto" selected>Auto Station</option>
          </select>
        </div>
        <div class="tb-right">
          <button id="btn-xray" type="button" class="icon-btn xray-btn active" title="Toggle live confidence inspection"><span class="xray-dot"></span><span>Confidence · On</span></button>
          <a class="icon-btn" href="./network.html">Network</a>
        </div>
      </header>

      <div id="thread-scroll" class="thread-scroll">
        <div id="thread-inner" class="thread-inner"></div>
      </div>

      <div class="composer-area">
        <div id="composer-box" class="composer-box">
          <div id="attach-strip" class="attach-strip"></div>
          <div class="composer-row">
            <input id="file-image" type="file" accept="image/*" multiple hidden />
            <button id="btn-attach" type="button" class="btn-attach" title="Attach image (or paste / drag &amp; drop)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <textarea id="composer-input" class="composer-input" rows="1" placeholder="Ask anything"></textarea>
            <button id="btn-send" type="button" class="btn-send">Send</button>
          </div>
        </div>
        <div id="ctx-meter" class="composer-foot">Space AI · Open community models</div>
      </div>
    </main>
  </div>

  <script>
  (() => {
    const c = document.getElementById("chat-cosmos-canvas");
    if (!c || !c.getContext) return;
    const ctx = c.getContext("2d");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stars = [];
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = Math.floor(window.innerWidth * dpr);
      c.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(130, Math.floor((window.innerWidth * window.innerHeight) / 11500));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 0.45 + Math.random() * 1.0,
        phase: Math.random() * Math.PI * 2,
        spd: 0.004 + Math.random() * 0.010,
        gold: Math.random() < 0.24,
      }));
    }
    resize();
    window.addEventListener("resize", resize);
    let raf = 0;
    function draw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const s of stars) {
        if (!reduced) s.phase += s.spd;
        const a = 0.14 + 0.48 * (0.5 + 0.5 * Math.sin(s.phase));
        ctx.fillStyle = s.gold ? `rgba(226, 176, 104, ${a.toFixed(2)})` : `rgba(244, 244, 248, ${a.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduced) raf = requestAnimationFrame(draw);
    }
    draw();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) cancelAnimationFrame(raf);
      else if (!reduced) draw();
    });
  })();
  </script>
  <script src="./chat.js?v=27"></script>
</body>
</html>
